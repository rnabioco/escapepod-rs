[workspace]
name = "escapepod-rs"
channels = ["conda-forge", "bioconda"]
# Two platforms for one machine type. `linux-64-cuda` is the same linux-64 with
# `__cuda` asserted, which is what conda-forge's CUDA builds require in order to
# solve at all. Only the `gpu` feature targets it (see `[feature.gpu]`); every
# other environment carries the empty `cpu` feature below to stay pinned to
# plain linux-64, so a developer without a GPU never has to satisfy `__cuda` and
# their lock entries never move. Needs pixi >= 0.77 for the named-variant
# syntax — on 0.76 the only spelling available re-keyed the workspace's single
# platform and dragged every environment onto it, which is why this repository
# fetched an onnxruntime wheel out of band until 2026-08-26.
platforms = ["linux-64", { name = "linux-64-cuda", platform = "linux-64", cuda = "12" }]

# Deliberately empty. Its only job is to pin an environment to plain `linux-64`
# rather than letting it inherit both workspace platforms — which the implicit
# `default` environment would otherwise do, so `default` is spelled out in
# `[environments]` below purely to carry this.
[feature.cpu]
platforms = ["linux-64"]

[dependencies]
samtools = ">=1.23,<2"
pysam = "*"
pandas = "*"
pyarrow = ">=22,<23"
pip = "*"
# mold is a base dependency so every environment links Rust with it — see the
# LD_PRELOAD/MOLD_PATH block below. gcc 11.5 on the compute nodes has no
# `-fuse-ld=mold` support, so we engage mold via its `mold-wrapper.so`
# LD_PRELOAD interposer (exactly what `mold -run` does) rather than a cargo
# linker override in .cargo/config.toml.
mold = ">=2.4"

# LD_PRELOAD makes mold the default linker for *every* command run in any pixi
# environment (bare `cargo build`, `cargo nextest run`, maturin, …), full time —
# not just the dev-env task wrappers. `mold-wrapper.so` intercepts the linker
# exec and redirects it to mold; for non-linker processes it is an inert
# passthrough. `$CONDA_PREFIX` resolves to the active env prefix, so this works
# uniformly across default/dev/python-test/gpu/… without hardcoding a path.
[activation]
env = { DORADO_VERSION = "1.4.0", DORADO_DIR = "$PIXI_PROJECT_ROOT/.pixi/tools", PATH = "$DORADO_DIR/dorado-$DORADO_VERSION-linux-x64/bin:$PATH", LD_PRELOAD = "$CONDA_PREFIX/lib/mold/mold-wrapper.so", MOLD_PATH = "$CONDA_PREFIX/bin/mold" }

[tasks]
install-dorado = """
mkdir -p $DORADO_DIR && \
curl -L https://cdn.oxfordnanoportal.com/software/analysis/dorado-$DORADO_VERSION-linux-x64.tar.gz | \
tar -xz -C $DORADO_DIR
"""
install-pod5 = "pip install 'pod5>=0.3.36,<0.4'"

# Create the `gpu` environment from a machine that has no GPU — which on a
# cluster is the normal case, because the login node is the one with network
# access and the GPU nodes are the ones with `__cuda`.
#
# Plain `pixi install -e gpu` fails there, and fails ugly: the `gpu` environment
# targets the `linux-64-cuda` platform, whose `__cuda` virtual package a GPU-less
# machine cannot provide, so the solver reports missing virtual packages. The
# resolve itself is already done and committed in pixi.lock; the only thing
# absent is the install-time probe, which is exactly what CONDA_OVERRIDE_CUDA
# supplies. Nothing is being faked about the solution — the packages installed
# are the ones the lockfile already names.
#
# On a GPU node this is unnecessary and `pixi install -e gpu` works directly.
install-gpu = "CONDA_OVERRIDE_CUDA=12 pixi install -e gpu"

# Python bindings test feature
[feature.python-test.dependencies]
python = ">=3.10"
numpy = "*"

[feature.python-test.pypi-dependencies]
maturin = ">=1.9,<2"
pytest = "*"
pod5 = ">=0.3.36,<0.4"
ruff = ">=0.15.21, <0.16"
ty = ">=0.0.58, <0.0.59"

[feature.python-test.tasks]
build-python = "maturin develop --manifest-path crates/escapepod-python/Cargo.toml"
test-python = { cmd = "pytest tests/python/ -v", depends-on = ["build-python"] }
test-compat = "python tests/compat/test_pod5_compat.py"
lint-python = "ruff check tests/python && ruff format --check tests/python"
# ty resolves `import escapepod` from the built extension, so build first.
typecheck-python = { cmd = "ty check tests/python crates/escapepod-python/escapepod.pyi", depends-on = [
  "build-python",
] }

# GPU (CUDA) feature. Covers the runtime needs of `--features gpu`, which is
# the whole of escpod's GPU surface. Every leg `load-dynamic`/dlopens, so
# nothing here is needed at build time:
#   * cudarc dlopens libnvrtc for the GPU DTW kernels (classify, train).
#   * onnxruntime's CUDA execution provider runs batched CNN adapter detection
#     (`demux detect --method cnn --gpu`) and the CTC-CRF encoder
#     (`demux basecall --gpu`, fused `demux --gpu`).
#
# Everything comes from conda-forge and is described by pixi.lock, including
# libonnxruntime. `pixi install -e gpu` is the whole setup; there is no fetch
# step, no unpack script, and no out-of-band directory.
#
# That last part is the point. Until 2026-08-26 the CUDA-enabled libonnxruntime
# was pip-downloaded into `.pixi/ort/` by an `install-ort` task, because
# conda-forge's CUDA builds depend on the `__cuda` virtual package and pixi 0.76
# could not scope that to one feature. `.pixi/ort` was then the only input to
# this environment that the lockfile did not describe — no version record, no
# checksum, re-fetched per clone — and that is exactly where a silent bug lived:
# PyPI's `onnxruntime-gpu` moved to CUDA 13 builds while the pins here said
# CUDA 12, and `--gpu` kept working only because our GPU nodes happen to carry a
# system `/usr/local/cuda-13.0` for the loader to fall through to. See #278.
#
# Pinning the `*cuda129` build makes that class of mismatch a solve error rather
# than prose: `cuda = "12"` on the platform excludes the `_cuda130` build.
#
# The explicit CUDA library pins below are NOT redundant. `onnxruntime-cpp`
# under-declares: its `libonnxruntime_providers_cuda.so` links libcudart.so.12,
# libcublas.so.12 and libcublasLt.so.12 and dlopens libcudnn.so.9, while the
# package depends only on `__cuda`, `cuda-version` and libgcc/libstdcxx. Drop
# them and the provider fails to load — which onnxruntime reports by falling
# back to CPU, i.e. as a slowdown rather than an error. Verified by `objdump -p`
# on the shipped .so; libcufft and libcurand are deliberately absent because
# this build, unlike the PyPI wheel, references neither.
[feature.gpu]
platforms = ["linux-64-cuda"]

[feature.gpu.dependencies]
cuda-version = "12.*"
cuda-nvrtc = ">=12,<13"    # GPU DTW (cudarc): libnvrtc.so.12
libcublas = "*"            # ort CUDA EP links libcublas.so.12 + libcublasLt.so.12
cuda-cudart = "*"          # ort CUDA EP links libcudart.so.12
cudnn = ">=9,<10"          # ort CUDA EP dlopens libcudnn.so.9
# The CUDA-enabled libonnxruntime that `ort` (load-dynamic) dlopens. Version is
# pinned against the workspace's ort 2.0.0-rc.13 (crates/escapepod-demux/
# Cargo.toml) — bump the two together, deliberately. The `*cuda129` build
# selector is what keeps this on CUDA 12; there is a `_cuda130` build too.
onnxruntime-cpp = { version = "1.28.*", build = "*cuda129" }

# LD_LIBRARY_PATH makes `$CONDA_PREFIX/lib` visible to the dlopen paths above
# (cudarc's libnvrtc, and the CUDA EP's cuDNN) — the conda-forge CUDA packages
# ship no activation hook that sets it. ORT_DYLIB_PATH can be a plain static
# path now that the library is an ordinary package: the lock guarantees the file
# exists in the environment, so the old "export it only if the file is there"
# script — which existed because a dangling ORT_DYLIB_PATH hangs escpod silently
# at startup — has nothing left to guard against.
[feature.gpu.activation]
env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH", ORT_DYLIB_PATH = "$CONDA_PREFIX/lib/libonnxruntime.so" }

[feature.warpdemux-bench.dependencies]
# Pinned to 3.12: ADAPTed's `@dataclass` patterns with mutable defaults
# break on Python 3.13's stricter checks.
python = ">=3.11,<3.13"
hyperfine = "*"
pip = "*"
numpy = "*"
cython = "*"
setuptools = "*"
wheel = "*"
scipy = "*"
scikit-learn = "*"
pandas = "*"
tqdm = "*"
bottleneck = "*"
pytorch = "*"
h5py = "*"
toml = "*"
psutil = "*"
attrs = "*"
matplotlib = "*"
catboost = "*"
joblib = "*"
ruptures = "*"
grpcio = "*"

[feature.warpdemux-bench.pypi-dependencies]
pod5 = ">=0.3.36,<0.4"
dtaidistance = "*"
vbz-h5py-plugin = "*"
# Required by `torch.onnx.export` on torch 2.x (ONNX exporter moved to
# onnxscript-backed tracing); also onnxruntime for the post-export smoke
# test inside scripts/export_adapter_cnn_to_onnx.py.
onnxscript = "*"
onnxruntime = "*"

[feature.warpdemux-bench.tasks]
# The sed step patches ADAPTed's SigProcConfig, which uses mutable class
# instances as dataclass defaults — disallowed on modern Python. The
# upstream repo hasn't released a fix, so we rewrite to
# `field(default_factory=...)` in place before the editable install.
install-warpdemux = """
python scripts/patch_adapted_dataclass.py ext/ADAPTed/adapted/config && \
pip install --no-build-isolation --no-deps -e ext/ADAPTed -e ext/WarpDemuX
"""

# Documentation feature (zensical site build). Terminal-demo gif regeneration is
# deliberately NOT here: VHS drives a headless Chromium + ffmpeg that is too heavy
# for the cluster, so it runs macOS-local via Homebrew — see docs/tapes/README.md.
[feature.docs.dependencies]
python = ">=3.10"

[feature.docs.pypi-dependencies]
zensical = "*"

[feature.docs.tasks]
docs-build = "zensical build"
docs-serve = "zensical serve"
# Mirrors the CI docs gate. --clean forces a cold cache: zensical's incremental
# cache makes --strict link validation nondeterministic (cached pages spuriously
# report "page does not exist"), so run the strict check against a fresh cache.
docs-check = "zensical build --clean --strict"

# Dev env: cargo-nextest plus convenience task wrappers. mold linking is no
# longer opt-in here — it is on for *every* environment via the base
# LD_PRELOAD/MOLD_PATH activation above, so these tasks no longer need the
# `mold -run` prefix (a bare `cargo …` already links with mold). GH Release
# binaries are built in CI against musl and are unaffected.
[feature.dev.dependencies]
cargo-nextest = ">=0.9"

[feature.dev.tasks]
build = "cargo build"
build-rel = "cargo build --release"
# nextest does not run doctests; use the test-doc task for those.
test = "cargo nextest run"
test-doc = "cargo test --doc"
check = "cargo check"
clippy = "cargo clippy --workspace --all-targets"

# Every non-GPU environment carries the empty `cpu` feature, which pins it to
# plain `linux-64`. Without it an environment inherits both workspace platforms
# and would need `__cuda` on machines that have no GPU. `default` is spelled out
# for exactly that reason and no other.
#
# The GPU environments deliberately leave the `default` solve group. Measured
# both ways: the resulting lock is identical, because a solve group cannot span
# platforms — pixi resolves `linux-64-cuda` separately whatever the group says.
# Keeping the annotation would have implied a coupling that does not exist.
#
# The practical consequence is that the GPU environments resolve independently
# and so sit slightly ahead of the shared group (24 version bumps at the time of
# the split, and openblas instead of mkl). That is inherent to the platform
# split, not to the group, and it is contained: these two environments exist to
# run GPU tests and benches, and no non-GPU environment moved at all.
[environments]
default = { features = ["cpu"] }
python-test = { features = ["python-test", "cpu"], solve-group = "default" }
docs = { features = ["docs", "cpu"], solve-group = "default" }
gpu = { features = ["gpu"] }
warpdemux-bench = { features = ["warpdemux-bench", "cpu"], solve-group = "default" }
dev = { features = ["dev", "cpu"], solve-group = "default" }
# dev + gpu combo for GPU work that still wants mold linking.
dev-gpu = { features = ["dev", "gpu"] }
