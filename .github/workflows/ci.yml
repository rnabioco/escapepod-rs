name: CI

# Docs and prose never affect a Rust build, so they do not start one. There is
# no branch protection on `main` and therefore no required status checks, so a
# workflow that simply does not run blocks nothing — no placeholder "always
# green" gate job is needed to keep merges unblocked. `docs.yml` still builds
# and deploys on `docs/**`.
#
# A commit touching both prose and code is NOT skipped: `paths-ignore` suppresses
# a run only when *every* changed path matches.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'

# Least privilege: CI only ever reads the tree. Elevate per-job if needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
# Never cancel main-branch pushes — key on ref so each PR/branch is independent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # NOTE: there is deliberately no separate `check` job. `cargo clippy
  # --workspace --all-targets` runs the same rustc front-end over the same unit
  # graph as `cargo check --workspace --all-targets` and then adds lints, so a
  # green clippy already implies a green check. Running both compiled the whole
  # workspace twice per PR for no extra signal, and — more expensively — kept a
  # second per-job Rust cache alive against the repo's 10 GB cache ceiling.

  cross-check:
    name: Check (aarch64)
    runs-on: ubuntu-latest
    # Post-merge, not per-PR: `github.event_name == 'push'` is main only, since
    # that is the only branch this workflow triggers a push on.
    #
    # Every other job here is x86_64, so code reachable only through the
    # `target_arch = "x86_64"` SIMD backends (DTW, SVB16, the CRF kernels) is
    # never compiled with those backends cfg'd out. Under `-Dwarnings` that
    # turns an unused helper or an unmutated `mut` into a hard error on
    # aarch64 only. The one such build used to be `release.yml`'s macOS job,
    # which runs on tag push — so the first sign of a break was a failed
    # release.
    #
    # Running it on main keeps that early warning (a break surfaces minutes
    # after merge, not at the next tag) while taking it off the PR path, where
    # it was the slowest job by an order of magnitude: it is the only job whose
    # dependency graph is compiled for a second target, so a `Cargo.lock`
    # change misses the cache and it rebuilds everything. Typical run is ~2
    # minutes; a cold one hit the 20-minute wall on #233 four seconds from
    # finishing, blocking a merge over an artefact of caching. The wall is 30
    # now, and nothing waits on it.
    #
    # `cargo check` never links, but zstd-sys still compiles C for the target,
    # hence the cross gcc.
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci
      # Doctests live here rather than in a job of their own. nextest does not
      # run them, but `cargo test --doc` needs the same toolchain, profile and
      # unit graph that nextest has just built — as a separate job it rebuilt
      # the entire dependency graph from scratch (406 s on a cold cache, against
      # ~2 s of actual doctest execution) and held one of the largest Rust
      # caches in the repo. Sharing this job's target directory makes it nearly
      # free.
      #
      # `--profile ci` above is a *nextest* profile (.config/nextest.toml), not
      # the cargo profile of the same shape; `--doc` takes the cargo default.
      - name: Doctests
        run: cargo test --doc --workspace
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test
          path: target/nextest/ci/junit.xml
          retention-days: 14

  test-features:
    name: Test (escapepod-demux + train)
    runs-on: ubuntu-latest
    # Worst observed was 11 min on a cold linfa-svm rebuild; 25 gives headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # Exercise the full demux crate surface: default features cover
      # classify + SVM predict, `train` pulls in linfa-svm.
      - run: cargo nextest run -p escapepod-demux --features train --profile ci
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-features
          path: target/nextest/ci/junit.xml
          retention-days: 14

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No rust-cache: rustfmt never builds the dependency graph, so there is
    # nothing to restore and a cache entry here would only consume the budget.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    # pixi solve + maturin build dominate; 25 covers a cold pixi cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: python-test
          cache: true
      - name: Lint Python (ruff)
        run: pixi run -e python-test lint-python
      - name: Type-check Python (ty)
        run: pixi run -e python-test typecheck-python
      - name: Build and test Python bindings
        run: pixi run -e python-test test-python

  compat:
    name: POD5 compat
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # `key` must change whenever the profile this job builds changes.
          # rust-cache derives its key from Cargo.lock and the toolchain, NOT
          # from the cargo profile — and GitHub will not overwrite an existing
          # cache key. So switching profiles without bumping this leaves the
          # old profile's artefacts sitting in the key forever: every run
          # restores artefacts it cannot use, rebuilds the whole dependency
          # graph, and then declines to save because the key already exists.
          # That is exactly what happened when this job moved off `release`,
          # and it cost more than the profile change saved (316 s -> 400 s).
          # Bump the suffix when the profile changes.
          key: dev-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The dev profile, deliberately. This suite round-trips a **five-read**
      # fixture; the binary's throughput is irrelevant to it (the test step
      # itself measures 1 s), while building an optimised one made this the
      # longest job in the workflow by an order of magnitude — 363 s of a 400 s
      # job, for 1 s of testing. Third-party crates still compile at
      # `opt-level = 2` via `[profile.dev.package."*"]`, so the dependency graph
      # is not built at -O0; only escapepod's own crates are, and those are the
      # ones that must rebuild on every source change anyway.
      #
      # The suite finds the binary via `ESCPOD_BIN`; without it, it prefers
      # `target/release` and would silently test a stale optimised build.
      - run: cargo build -p escapepod-cli
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: python-test
          cache: true
      - name: Round-trip compat vs Python pod5
        run: pixi run -e python-test test-compat
        env:
          ESCPOD_BIN: ${{ github.workspace }}/target/debug/escpod

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace

  features:
    name: Feature builds (gpu / models-download)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The default jobs never compile the *opt-in* features, so a dependency bump
    # to cudarc / tract-onnx / ort can break these builds while every other
    # check stays green — exactly how the cudarc and tract-onnx Dependabot PRs
    # slipped through. cudarc and ort use runtime dynamic loading, so this needs
    # no CUDA toolkit, libonnxruntime, or GPU.
    #
    # "opt-in" is load-bearing, and is why `cnn-detect` and `crf-decode` are not
    # built here any more: both are in escapepod-cli's *default* `cli` feature,
    # so `cargo clippy --workspace --all-targets` already compiles escapepod-demux
    # with them (workspace feature unification), and building them again on their
    # own was a duplicate pass against this job's own stated premise.
    #
    # These run `clippy`, not `check`. `RUSTFLAGS: -Dwarnings` (workflow env)
    # only denies lints that are actually *evaluated*, and `cargo check` never
    # evaluates a clippy lint — so an opt-in feature could carry a clippy error
    # indefinitely while both this job and the `clippy` job (which builds
    # default features only) stayed green. `clippy::large_enum_variant` on the
    # CLI's `Basecaller` under the GPU CRF encoder did exactly that.
    #
    # `escapepod-cli` is covered as well as the library crates: the CLI is where
    # the feature-gated command wiring lives, and it is a different crate from
    # the one the feature flag names, so checking `escapepod-demux` alone misses
    # it.
    #
    # There used to be four more steps here, isolating `cnn-gpu` and `crf-gpu`
    # in each of escapepod-demux and escapepod-cli. Those features are gone:
    # `gpu` is now the single GPU flag, so the only builds left to prove are the
    # ones somebody actually produces, and each of the three steps below is one
    # of them. Isolation builds were the last stated reason for keeping the
    # granular flags, and they only ever proved that binaries nobody ships
    # compile.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # escapepod-signal's `gpu` is deliberately still its own, narrower feature:
      # cudarc/NVRTC DTW only, no onnxruntime. It is the one crate here with a
      # plausible external consumer, so it keeps a flag that does not drag ort in.
      - name: gpu — DTW CUDA kernel (cudarc, escapepod-signal)
        run: cargo clippy -p escapepod-signal --features gpu
      - name: gpu — every GPU path (cudarc + ort, escapepod-demux)
        run: cargo clippy -p escapepod-demux --features gpu
      - name: gpu — CLI union (what `--features gpu` users build)
        run: cargo clippy -p escapepod-cli --features gpu
      - name: models-download — k-mer model prefetch (ureq rustls + sha2)
        run: cargo clippy -p escapepod-cli --features models-download
