name: Coverage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    # One instrumented run, then three rendering passes over it; 25 covers cold.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests with coverage
        # Library crates covered by nextest: escapepod-pod5,
        # escapepod-signal, escapepod-demux. escapepod-python (pyo3
        # bindings exercised by the Python test harness) and escapepod-cli
        # (binary; command handlers covered end-to-end via compat tests)
        # are intentionally excluded from the lines gate.
        #
        # `--no-report` runs the instrumented suite and leaves the raw profile
        # data in place without rendering anything. Every report below is then
        # a pure rendering step over that one run. This used to be two full
        # instrumented runs of the same tests — one for lcov, one for HTML —
        # which was most of the job's ~8 minutes.
        run: >
          cargo llvm-cov nextest
          --no-report
          --package escapepod-pod5
          --package escapepod-signal
          --package escapepod-demux
          --features escapepod-demux/train

      - name: LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Enforce workspace threshold (libraries only)
        run: cargo llvm-cov report --summary-only --fail-under-lines 60

      - name: Upload LCOV report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

      # `always()` so a failed threshold still produces the report that
      # explains it. Rendering only — the tests are not run again.
      - name: HTML report
        if: always()
        run: cargo llvm-cov report --html --output-dir coverage-html

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14
