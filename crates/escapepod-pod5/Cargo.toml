[package]
name = "escapepod-pod5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "POD5 file format I/O (Oxford Nanopore) — reader, writer, VBZ compression"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "nanopore", "pod5", "sequencing"]
categories = ["parser-implementations", "science"]

[[bench]]
harness = false
name = "io_hot_paths"

[features]
default = []
# Lazy reading of POD5 objects over S3/GCS/Azure/HTTPS range requests. Off by
# default: it pulls in object_store + tokio, which a local-file build has no
# use for.
remote = ["dep:object_store", "dep:tokio", "dep:url"]

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
byteorder = { workspace = true }
bytes = "1.9"
csv = "1"
flatbuffers = { workspace = true }
memmap2 = { workspace = true }
object_store = { workspace = true, optional = true }
rayon = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
