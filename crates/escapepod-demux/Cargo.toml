[package]
name = "escapepod-demux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Barcode demultiplexing for Oxford Nanopore POD5 data — WarpDemuX-compatible DTW+SVM classification and CTC-CRF barcode basecalling, with optional CNN adapter detection and GPU acceleration."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["barcode", "basecalling", "demultiplex", "nanopore", "pod5"]
categories = ["algorithms", "science"]

[[bench]]
harness = false
name = "classify"

[[bench]]
harness = false
name = "crf_decode"

# The boundary-CNN input prep (`AdapterCnnConfig::prep`), which only exists
# under `cnn-detect`; run with `--features cnn-detect`.
[[bench]]
harness = false
name = "adapter_prep"
required-features = ["cnn-detect"]

# The probe links tract-onnx directly, which only exists under the ONNX
# features. Without this a plain `cargo test -p escapepod-demux` tries to build
# it anyway and fails to resolve the crate — which is how CI caught it (#163).
# Gated on `crf-decode` rather than `cnn-detect`: both pull tract, but the probe
# is about the CRF encoder, and `crf-decode` did not exist when #163 landed.
[[example]]
name = "tract_crf_probe"
required-features = ["crf-decode"]

[dependencies]
anyhow = { workspace = true }
escapepod-pod5 = { workspace = true }
escapepod-signal = { workspace = true }
ndarray = "0.17"
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
uuid = { workspace = true }

# SVM training (opt-in via `train`).
linfa = { version = "0.8", optional = true }
linfa-svm = { version = "0.8", optional = true }

# Edit-distance alignment for barcode matching (opt-in via `crf-decode`).
# A zero-runtime-dependency leaf crate extracted from fqxv for exactly this
# (rnabioco/fqxv#252), so it brings no dependency cone with it. Pinned to a rev
# rather than tracking a branch. Note a git dependency would block
# `cargo publish`; neither this crate nor escapepod-cli is published today, and
# shipping barcode assignment in the default binary is worth more than keeping
# that door open (a `basecall` that emits sequences nobody can act on repeats
# the mistake `cnn-detect` was promoted to fix).
fqxv-align = { git = "https://github.com/rnabioco/fqxv", rev = "a3af3d891f242f15e828ab2126069aa5dd67e693", optional = true }

# CNN adapter detection (opt-in via `cnn-detect`). Pure-Rust ONNX runtime;
# user supplies the model file at runtime (weights are CC BY-NC).
tract-onnx = { workspace = true, optional = true }

# GPU boundary-CNN and CTC-CRF-encoder inference (opt-in via `gpu`).
# onnxruntime via the `ort` crate, CUDA execution provider. `load-dynamic`
# dlopens onnxruntime at runtime (nothing needed at build time); set
# `ORT_DYLIB_PATH` to a CUDA-enabled libonnxruntime to run. Both paths are
# architecture-agnostic — the boundary CNN keeps the same `[B,1,L] -> [B,2,L]`
# contract as the tract CPU path, the CRF encoder the same time-major
# `[B,1,chunk] -> [T,B,n_score]`.
# `default-features = false` is load-bearing, not tidying: ort's default set
# includes `download-binaries`, which drags in ureq + native-tls + openssl-sys.
# Under `load-dynamic` nothing is ever downloaded or linked at build time, so
# that TLS stack is dead weight in the graph — and it broke the GPU release
# artifact, which builds in a `manylinux_2_28` container with no openssl-devel.
# `std`/`ndarray`/`tracing`/`api-27` are the defaults we do use, restated.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "api-27",
    "cuda",
    "load-dynamic",
    "ndarray",
    "std",
    "tracing",
] }

# CUDA driver bindings for the on-device SVM pipeline (RBF + OvO
# decision). Opt-in via the `gpu` feature, same as the DTW kernel itself.
cudarc = { workspace = true, optional = true }

# Per-chunk progress bar for `classify_with_svm_batch_gpu_*`. Opt-in via
# the `gpu` feature since the only progress reporting we have today is
# in the batched GPU classify loop.
indicatif = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.8"
rand = "0.10"
tempfile = "3"

[features]
default = []
# CNN-based adapter detection: runs a user-supplied boundary-CNN ONNX graph
# (`[B,1,L] -> [B,2,L]`) through tract-onnx on the CPU. Architecture-agnostic
# (escapepod-models' adapter_rna004 TCN, or an ADAPTed BoundariesCNN export —
# those weights are CC BY-NC 4.0 and must not be bundled). No GPU CNN path.
cnn-detect = ["dep:tract-onnx"]
# CTC-CRF barcode basecalling: runs a user-supplied CRF *encoder* ONNX graph
# (`[B,1,chunk] -> [T,B,n_score]`, time-major) through tract-onnx on the CPU and
# decodes the lattice natively. Only the encoder needs this feature — the
# lattice decode in `crf::lattice` has no dependencies and is always compiled,
# so CI covers the Viterbi without needing a model file.
crf-decode = ["dep:tract-onnx", "dep:fqxv-align"]
# Every GPU path this crate has, in one flag. There is deliberately no finer
# grain: the three legs (CUDA DTW, GPU CNN adapter detection, GPU CTC-CRF
# encoder) are stages of the same pipeline, and a build with only some of them
# needs runtime prose explaining which half of `--gpu` is a no-op — logic that
# only ever described builds nobody produced. This crate has a git dependency
# (`fqxv-align`) and so cannot be `cargo publish`ed, so there is no external
# consumer whose dependency graph a coarser flag could bloat.
#
# What it pulls: the GPU DTW kernel from `escapepod-signal` plus cudarc directly
# (the post-DTW SVM pipeline — RBF + OvO decision — launches its own kernels via
# the shared device handle), and `ort` for the two onnxruntime CUDA paths, which
# in turn need their CPU counterparts (`cnn-detect`, `crf-decode`) for the shared
# prep/decode. The CRF lattice decode deliberately stays on the CPU (see
# `crf::encoder_gpu`), so the AVX2/AVX-512 kernels matter more here, not less.
#
# Nothing is required at build time. At run time the DTW leg needs the CUDA
# driver + libnvrtc, and the onnxruntime legs need a CUDA-enabled
# libonnxruntime on `ORT_DYLIB_PATH` (`ort` is `load-dynamic`).
gpu = [
    "cnn-detect",
    "crf-decode",
    "dep:cudarc",
    "dep:indicatif",
    "dep:ort",
    "escapepod-signal/gpu",
]
# Train `DtwSvmModel` JSON files from labeled fingerprints (linfa-svm).
train = ["dep:linfa", "dep:linfa-svm"]

[[example]]
name = "crf_basecall_check"
required-features = ["crf-decode"]

[[example]]
name = "crf_gpu_floor"
required-features = ["gpu"]

[[example]]
name = "cnn_gpu_floor"
required-features = ["gpu"]

[[example]]
name = "cnn_pad_probe"
required-features = ["gpu"]

# Does tract load a given ONNX graph? Kept because it is the evidence behind a
# load-bearing decision, twice over: five configurations of
# `charging_tcn_rna004@v0.1.0` (a PyTorch *dynamo* export) all parse and then
# fail tract's shape analysis, and the same probe is what showed the `@v0.1.1`
# re-export parses, optimizes and runs — which is why
# `escapepod_classify::waveform_net` is tract and not onnxruntime. It is also
# what settles WHICH layer is at fault, a question two repos got wrong from the
# op name alone. Lives here rather than in escapepod-classify so that a broken
# in-progress crate cannot block the measurement.
[[example]]
name = "tract_dynamo_probe"
required-features = ["cnn-detect"]
