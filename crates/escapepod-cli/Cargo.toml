[package]
name = "escapepod-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust toolkit for Oxford Nanopore POD5 — the `escpod` CLI plus an optional library re-exporting format I/O, signal processing, and barcode demultiplexing"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "cli", "nanopore", "pod5", "sequencing"]
categories = ["command-line-utilities", "science"]

# The `escpod` binary is the primary artifact: this crate builds it via the
# default `cli` feature. Library-only consumers can opt out with
# `default-features = false` and pick the layers they want (pod5/signal/demux),
# which keeps clap/noodles/etc. out of their dependency graph. The library is
# imported as `escapepod_cli` (e.g. `use escapepod_cli::signal`).
[[bin]]
name = "escpod"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Library re-export layers (see src/lib.rs). Optional so a `default-features =
# false` build pulls in only the layers the consumer asks for.
escapepod-pod5 = { workspace = true, optional = true }
escapepod-signal = { workspace = true, optional = true }
escapepod-demux = { workspace = true, optional = true }

# CLI-only dependencies. All optional and rolled into the `cli` feature so the
# library surface stays lean.
anyhow = { version = "1", optional = true }
arrow = { workspace = true, optional = true }
bstr = { version = "1", optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
csv = { version = "1", optional = true }
ctrlc = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
indicatif = { workspace = true, optional = true }
# Reset SIGPIPE to default so `escpod view … | head` exits quietly (Unix only)
libc = { version = "0.2", optional = true }
# BAM file support
noodles-bam = { version = "0.91", optional = true }
noodles-bgzf = { version = "0.48", optional = true }
noodles-core = { version = "0.20", optional = true }
noodles-csi = { version = "0.57", optional = true }
noodles-sam = { version = "0.86", optional = true }
owo-colors = { version = "4", optional = true }
parquet = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# k-mer model prefetch (models-download feature).
sha2 = { workspace = true, optional = true }
tabled = { version = "0.21", features = ["ansi"], optional = true }
tempfile = { version = "3", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
walkdir = { version = "2", optional = true }

[features]
# The `cli` feature ships the `escpod` CLI out of the box.
default = ["cli"]

# Library re-export layers. `signal` pulls the pod5 layer transitively.
pod5 = ["dep:escapepod-pod5"]
signal = ["dep:escapepod-signal"]
demux = ["dep:escapepod-demux"]

# The `escpod` binary and everything it links. Implies the `signal`, `demux`
# and `cnn-detect` layers. `demux` is in the default build because it pulls in
# **no** additional third-party crates — ndarray, serde_json, rayon and uuid are
# all already in the CLI dependency graph — so shipping it costs only compile
# time. `cnn-detect` does add one (tract-onnx), but only to the binary: library
# consumers reach the layers through `default-features = false` (they have to,
# or they inherit clap/noodles/parquet), so they never pay for it. It is in the
# default build because `--method cnn` is how the shipped barcode models reach
# their published accuracy — without it `escpod demux` silently falls back to
# the less accurate LLR boundary detector.
cli = [
    "signal",
    "demux",
    "cnn-detect",
    "dep:anyhow",
    "dep:arrow",
    "dep:bstr",
    "dep:chrono",
    "dep:clap",
    "dep:csv",
    "dep:ctrlc",
    "dep:flate2",
    "dep:indicatif",
    "dep:libc",
    "dep:noodles-bam",
    "dep:noodles-bgzf",
    "dep:noodles-core",
    "dep:noodles-csi",
    "dep:noodles-sam",
    "dep:owo-colors",
    "dep:parquet",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:tabled",
    "dep:tempfile",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:walkdir",
]

# CNN/TCN-based adapter detection through tract-onnx. Part of the `cli` feature
# (see above); still selectable on its own for `default-features = false`
# consumers. No weights are bundled — the caller supplies an ONNX file on the
# `[B,1,L] -> [B,2,L]` contract at runtime, e.g. escapepod-models'
# `adapter_rna004` (CC BY 4.0) or an ADAPTed export (CC BY-NC 4.0).
cnn-detect = ["demux", "escapepod-demux/cnn-detect"]
# Batched GPU CNN/TCN adapter detection via onnxruntime CUDA (`escpod demux
# detect --method cnn --gpu`). Implies `cnn-detect` for the shared CPU path and
# preprocessing. Needs a CUDA-enabled libonnxruntime + visible GPU at runtime.
cnn-gpu = ["cnn-detect", "escapepod-demux/cnn-gpu"]
experimental = []
# Download k-mer level models from the pinned nanoporetech/kmer_models commit
# into the local cache (`escpod resquiggle models fetch`). Opt-in so the default
# release binary pulls no TLS stack; implies `experimental` (the resquiggle
# command it serves). Prefetch on a networked node; runtime never downloads.
models-download = ["experimental", "dep:ureq", "dep:sha2"]
# EXPERIMENTAL. GPU-accelerated DTW for demux classify and train-svm (requires
# a CUDA driver + libnvrtc at runtime).
#
# Not recommended for production use as of 0.6.x: on a full node the CPU DTW is
# *faster*. Measured on 1.22M reads with a DTW-SVM model against an A30 —
# 113.0 s on 64 CPU cores vs 132.4 s with `--gpu` (0.85×), plus ~2.2 GB more
# RSS. An apparent 1.67× win disappears once the CPU is given the whole node
# rather than 16 of 64 cores. It may still help where cores are scarce relative
# to the DTW workload. See benchmarks/README.md.
gpu = ["demux", "escapepod-demux/gpu"]
# Training support for demux SVM models (implies `demux`).
train = ["demux", "escapepod-demux/train"]

[package.metadata.docs.rs]
# Document the library layers, not the CLI deps.
no-default-features = true
features = ["pod5", "signal", "demux"]
