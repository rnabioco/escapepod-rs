[package]
name = "escapepod-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure-Rust toolkit for Oxford Nanopore POD5 — the `escpod` CLI"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "cli", "nanopore", "pod5", "sequencing"]
categories = ["command-line-utilities", "science"]

# The `escpod` binary is the only artifact of this crate (there is no library
# target). Library consumers depend on the layer crates directly.
[[bin]]
name = "escpod"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
escapepod-signal = { workspace = true }
escapepod-demux = { workspace = true }
# `fnn-onnx` (the per-base-feature ONNX variant of a charging bundle) and
# `waveform-onnx` (the windowed raw-signal variant) are always on: tract is
# already in the binary, and a binary that cannot load the shipped bundle
# would leave it unusable (0.727 of reads callable at 99% precision for the
# feature network against the GBM's 0.449 on a held-out flowcell).
escapepod-classify = { workspace = true, features = ["fnn-onnx", "waveform-onnx"] }

# CLI-only dependencies. All optional and rolled into the `cli` feature so the
# library surface stays lean.
anyhow = { version = "1", optional = true }
arrow = { workspace = true, optional = true }
bstr = { version = "1", optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
csv = { version = "1", optional = true }
ctrlc = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
indicatif = { workspace = true, optional = true }
# Reset SIGPIPE to default so `escpod view … | head` exits quietly (Unix only)
libc = { version = "0.2", optional = true }
# The global allocator for the binary; see main.rs for the measurement. Its
# own feature rather than part of `cli`, so a build without it exists to
# measure against.
mimalloc = { version = "0.1", optional = true }
# BAM file support
noodles-bam = { version = "0.98", optional = true }
noodles-bgzf = { version = "0.52", optional = true }
noodles-core = { version = "0.21", optional = true }
noodles-csi = { version = "0.62", optional = true }
noodles-sam = { version = "0.91", optional = true }
owo-colors = { version = "4", optional = true }
parquet = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# k-mer model prefetch (models-download feature).
sha2 = { workspace = true, optional = true }
tabled = { version = "0.22", features = ["ansi"], optional = true }
tempfile = { version = "3", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
# Release bundles ship as zip archives; deflate is the only method they use and
# rides on flate2, which is already in the graph.
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
uuid = { workspace = true, optional = true }
walkdir = { version = "2", optional = true }

[features]
# The `cli` feature ships the `escpod` CLI out of the box, with mimalloc as
# its allocator. `--no-default-features --features cli` is the same binary on
# the system allocator, kept buildable so the two can be measured against each
# other (benchmarks/README.md has the numbers that put mimalloc here).
default = ["cli", "mimalloc"]
mimalloc = ["dep:mimalloc"]

# The `escpod` binary and everything it links. Implies the `demux`
# and `cnn-detect` layers. `demux` is in the default build because it pulls in
# **no** additional third-party crates — ndarray, serde_json, rayon and uuid are
# all already in the CLI dependency graph — so shipping it costs only compile
# time. `cnn-detect` does add one (tract-onnx), but only to the binary: library
# consumers reach the layers through `default-features = false` (they have to,
# or they inherit clap/noodles/parquet), so they never pay for it. It is in the
# default build because `--method cnn` is how the shipped barcode models reach
# their published accuracy — without it `escpod demux` silently falls back to
# the less accurate LLR boundary detector.
cli = [
    "cnn-detect",
    "crf-decode",
    "demux-models",
    "model-fetch",
    "dep:anyhow",
    "dep:arrow",
    "dep:bstr",
    "dep:chrono",
    "dep:clap",
    "dep:csv",
    "dep:ctrlc",
    "dep:flate2",
    "dep:indicatif",
    "dep:libc",
    "dep:noodles-bam",
    "dep:noodles-bgzf",
    "dep:noodles-core",
    "dep:noodles-csi",
    "dep:noodles-sam",
    "dep:owo-colors",
    "dep:parquet",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:tabled",
    "dep:tempfile",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:walkdir",
]

# CNN/TCN-based adapter detection through tract-onnx. Part of the `cli` feature
# (see above); still selectable on its own for `default-features = false`
# consumers. No weights are bundled — the caller supplies an ONNX file on the
# `[B,1,L] -> [B,2,L]` contract at runtime, e.g. escapepod-models'
# `adapter_rna004` (CC BY 4.0) or an ADAPTed export (CC BY-NC 4.0).
cnn-detect = ["escapepod-demux/cnn-detect"]

# CTC-CRF barcode basecalling (`escpod demux basecall`). Part of the `cli`
# feature: it needs tract-onnx, which `cnn-detect` already links, so shipping it
# in the default build costs compile time and nothing else. The lattice decode
# it depends on has no third-party dependencies at all.
crf-decode = ["escapepod-demux/crf-decode"]

# Resquiggle shares classify's basecaller-tag decoders
# (and the two are expected to grow together — both are BAM + move-table
# signal-anchored analyses).
experimental = []
# Shared model-prefetch machinery: HTTPS (ureq/rustls), sha256 verification, and
# zip extraction for release bundles. Split out so the demux model fetch can
# ship by default without dragging in `experimental`, which gates the whole
# resquiggle command.
#
# This is what puts a TLS stack in the default release binary. That is a
# deliberate trade: without it `escpod demux models fetch` cannot exist, and
# there is then no supported way to obtain the boundary/barcode models at all
# (they are gitignored upstream and distributed via GitHub Releases).
model-fetch = ["dep:ureq", "dep:sha2", "dep:zip"]
# Download k-mer level models from the pinned nanoporetech/kmer_models commit
# into the local cache (`escpod resquiggle models fetch`). Still opt-in, and
# still implies `experimental` (the resquiggle command it serves).
models-download = ["experimental", "model-fetch"]
# Demux boundary/barcode model manifest, cache and offline resolution
# (`escpod demux models`). Fetching additionally needs `model-fetch`; without it
# the subcommand still lists, resolves and reports the cache, and `fetch` errors
# with a rebuild hint.
demux-models = []
# The one GPU switch, and the only one: every GPU path in one flag — CUDA DTW
# (cudarc/NVRTC), GPU CNN adapter detection, and the GPU CTC-CRF encoder
# (both onnxruntime CUDA). `--device` at runtime then decides per stage, and
# `auto` picks the ones that actually win. Nothing is needed at build time; at
# run time the DTW path needs the CUDA driver + libnvrtc, and the onnxruntime
# paths need a CUDA-enabled libonnxruntime on ORT_DYLIB_PATH (ort is
# `load-dynamic`, so a gpu-built binary runs fine on CPU-only boxes —
# `--device auto` falls back on its own, only `--device gpu` insists).
#
# There used to be granular `cnn-gpu` / `crf-gpu` flags underneath this one,
# justified as serving library consumers and CI isolation builds. Neither
# holds: `escapepod-demux` is not published, so neither it nor this
# crate has external consumers to serve,
# and the isolation builds only ever proved that partial-GPU binaries compile —
# binaries nobody ships, whose sole cost was the runtime prose in
# `commands/demux/run.rs` explaining which half of a GPU request was a silent
# no-op. Folding them in deletes that explaining. `escapepod-signal/gpu` stays
# separate on purpose: it is cudarc-only (no onnxruntime), genuinely narrower,
# and that crate has no git dependency blocking publication.
#
# Caveat for the DTW leg specifically: on a full node the CPU DTW is *faster*
# (113.0 s on 64 cores vs 132.4 s on an A30 for 1.22M reads, +~2.2 GB RSS) —
# the wins are CNN detection and the CRF encoder. See benchmarks/README.md.
#
# `escapepod-classify/cuda` is the fourth leg: the windowed charging
# classifier's TCN, batched through `tract-cuda` rather than `ort` (no LSTM in
# that graph, so tract-cuda's Conv kernel is enough — see
# `escapepod-classify/examples/tcn_cuda_probe.rs` for the measurement this
# leg is built from). A plain `cargo build --features gpu` already enables
# `classify`'s `waveform-onnx`, so this needs nothing beyond the one edge
# here; `cuda`'s own `dep:tract-cuda` pins `cudarc` at the same version
# `escapepod-demux/gpu` already pulls in (`cuda-12020`), so the two coexist in
# one binary without a resolver conflict.
gpu = [
    "cnn-detect",
    "crf-decode",
    "escapepod-demux/gpu",
    "escapepod-classify/cuda",
]
