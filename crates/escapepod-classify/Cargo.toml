[package]
name = "escapepod-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-level classification against escapepod-models bundles: the tRNA charging (aminoacylation) classifier over POD5 + aligned BAM."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "nanopore", "pod5", "sequencing"]
categories = ["science"]

[dependencies]
anyhow = { workspace = true }
# GBM runtime (tree walk + heads) — the model format `escpod` already runs.
escapepod-demux = { workspace = true }
# k-mer level primitives (extract_levels, load_kmer_table) and the POD5 surface.
escapepod-signal = { workspace = true }
# BAM reading for the pipeline (record types + the scan loop); writing the
# cl-tagged output BAM stays in the CLI.
noodles-bam = "0.95"
noodles-bgzf = "0.51"
noodles-sam = "0.90"
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
# One debug line: which loaded models needed their convolution padding hoisted
# (`fnn::hoist_conv_padding`), so a slow model can be diagnosed without a
# profiler.
tracing = { workspace = true }
# ONNX runtime for both graph-scored variants of a charging bundle — the
# per-base-feature network (`feature_model`) and the windowed raw-signal one
# (`waveform_model`). Optional, but free in practice: `escapepod-cli` already
# links tract through escapepod-demux's `cnn-detect`, so turning either on adds
# no third-party crate to the binary — only this crate's own edge to it.
tract-onnx = { workspace = true, optional = true }
# CUDA execution for a tract graph. Optional and NOT in any default build;
# cudarc dlopens, so this costs nothing at build time and needs a visible GPU
# only at run time. See the `cuda` feature.
# `cuda-13000` (tract-cuda's own default), NOT the `cuda-12020` the workspace
# pins for the DTW kernels: tract-cuda compiles its kernels at run time through
# NVRTC, which pulls the *node's* CUDA headers, and the gpu partition ships
# 13.0. Built against 12.2 bindings, NVRTC fails to parse 13.0's
# `cuda_fp4.hpp` / `cuda_fp6.hpp` and every launch dies with a dozen syntax
# errors out of a header nobody wrote. If this ever shares a build with
# `escapepod-signal/gpu`, cargo unifies the two cudarc feature sets and that
# conflict has to be resolved rather than discovered on a GPU node.
tract-cuda = { version = "0.23.6", optional = true, default-features = false, features = [
    "cuda-12020",
] }
tract-core = { version = "0.23.6", optional = true }
# Named directly (not only pulled in transitively via tract-cuda) so
# `waveform_net_gpu::cudart_runtime_probe` can check the host's CUDA
# *runtime* library for the symbol tract-cuda's pinned `cuda-12020` build
# resolves against, without ever calling cudarc's own dlsym wrapper — that
# wrapper `panic!`s on a miss (rnabioco/escapepod-rs#347) rather than
# returning a `Result`, and this workspace's `release` profile pins
# `panic = "abort"`, so such a panic is not even catchable in the binaries
# actually shipped. Cargo unifies this with the workspace's own `cudarc`
# pin (also `cuda-12020` + `dynamic-loading`), so this adds no new build.
cudarc = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

# The per-read charging path — the step `escpod classify` repeats once per
# read, and the one thing in this crate a regression would show up in at
# production scale. Self-contained (synthetic read, synthetic k-mer table), so
# it runs in CI where the `ext/` fixtures do not exist; the scorer group needs
# a real bundle and skips itself without one.
[[bench]]
harness = false
name = "charging"

# Verifies a real bundle against reference probabilities; needs the runtime it
# is verifying.
[[example]]
name = "verify_feature_model"
required-features = ["fnn-onnx"]

# The windowed variant's counterpart: checks the graph and the tensor assembly
# separately, against the corpus the model was trained on.
[[example]]
name = "verify_waveform_model"
required-features = ["waveform-onnx"]

# Decides whether the windowed variant should get a device path at all. Builds
# without CUDA present; needs a GPU only to run.
[[example]]
name = "tcn_cuda_probe"
required-features = ["waveform-onnx"]

# rnabioco/escapepod-rs#343's own repro, kept runnable as a quick CPU-vs-GPU
# regression check that skips the CLI's BAM/FASTA/POD5 plumbing — calls
# `classify_reads`/`classify_reads_gpu` directly, against either the shipped
# fixture or a real dataset via `--pod5`/`--bam`/`--fasta`/`--limit`.
[[example]]
name = "diag_343"
required-features = ["cuda"]

[features]
default = []
# Load and score the `feature_model` (per-base-feature ONNX) variant of a
# charging bundle. Without it such a bundle is *refused at load* with a
# rebuild hint — never silently mis-scored, and never confused with the
# raw-signal CNN variant, which this crate does not implement at all.
#
# `escapepod-demux/cnn-detect` is what makes `escapepod_demux::onnx_rewrite`
# exist (the padding hoist every tract loader applies); it adds nothing to the
# dependency graph that `dep:tract-onnx` did not already.
fnn-onnx = ["dep:tract-onnx", "escapepod-demux/cnn-detect"]
# Load and score the windowed raw-signal (`waveform_model`) variant. A separate
# feature from `fnn-onnx` because it names a different *variant*, not a
# different runtime — both go through tract, and both are in `escapepod-cli`'s
# default build. Without it such a bundle is refused at load with a rebuild
# hint, never mis-scored.
#
# It ran through `ort` until `charging_tcn_rna004@v0.1.1`, whose re-export
# tract can load; see `waveform_net` for the measurement and why the export
# version is the thing that decides this.
waveform-onnx = ["dep:tract-onnx", "escapepod-demux/cnn-detect"]
# Run a tract graph on a CUDA device. Opt-in, and nothing CUDA is needed at
# BUILD time: tract-cuda goes through cudarc, which dlopens, exactly like this
# workspace's other GPU paths. Backs `waveform_net_gpu::WaveformNetGpu`, the
# windowed variant's batched GPU scorer — `examples/tcn_cuda_probe` is the
# measurement that decided the scorer was worth building, kept re-runnable
# rather than retired now that it is. `escapepod-cli`'s `gpu` feature forwards
# to this one, so the code compiles and links end to end, and
# `commands/classify.rs` routes this stage through `place_and_report` like
# every other GPU-capable stage — `WaveformNetGpu::load` still refuses batch
# < 2 outright (a confirmed, reproducible bug there), independent of this
# gate. See rnabioco/escapepod-rs#343 and `waveform_net_gpu`'s module doc for
# the full evidence trail, including a separate rare anomaly never seen at
# batch >= 2.
cuda = ["dep:tract-cuda", "dep:tract-core", "dep:cudarc", "waveform-onnx"]
