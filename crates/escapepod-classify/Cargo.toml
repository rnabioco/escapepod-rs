[package]
name = "escapepod-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-level classification against escapepod-models bundles: the tRNA charging (aminoacylation) classifier over POD5 + aligned BAM."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "nanopore", "pod5", "sequencing"]
categories = ["science"]

[dependencies]
anyhow = { workspace = true }
# GBM runtime (tree walk + heads) — the model format `escpod` already runs.
escapepod-demux = { workspace = true }
# k-mer level primitives (extract_levels, load_kmer_table) and the POD5 surface.
escapepod-signal = { workspace = true }
# BAM reading for the pipeline (record types + the scan loop); writing the
# cl-tagged output BAM stays in the CLI.
noodles-bam = "0.95"
noodles-bgzf = "0.51"
noodles-sam = "0.90"
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
# One debug line: which loaded models needed their convolution padding hoisted
# (`fnn::hoist_conv_padding`), so a slow model can be diagnosed without a
# profiler.
tracing = { workspace = true }
# ONNX runtime for both graph-scored variants of a charging bundle — the
# per-base-feature network (`feature_model`) and the windowed raw-signal one
# (`waveform_model`). Optional, but free in practice: `escapepod-cli` already
# links tract through escapepod-demux's `cnn-detect`, so turning either on adds
# no third-party crate to the binary — only this crate's own edge to it.
tract-onnx = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Verifies a real bundle against reference probabilities; needs the runtime it
# is verifying.
[[example]]
name = "verify_feature_model"
required-features = ["fnn-onnx"]

# The windowed variant's counterpart: checks the graph and the tensor assembly
# separately, against the corpus the model was trained on.
[[example]]
name = "verify_waveform_model"
required-features = ["waveform-onnx"]

[features]
default = []
# Load and score the `feature_model` (per-base-feature ONNX) variant of a
# charging bundle. Without it such a bundle is *refused at load* with a
# rebuild hint — never silently mis-scored, and never confused with the
# raw-signal CNN variant, which this crate does not implement at all.
fnn-onnx = ["dep:tract-onnx"]
# Load and score the windowed raw-signal (`waveform_model`) variant. A separate
# feature from `fnn-onnx` because it names a different *variant*, not a
# different runtime — both go through tract, and both are in `escapepod-cli`'s
# default build. Without it such a bundle is refused at load with a rebuild
# hint, never mis-scored.
#
# It ran through `ort` until `charging_tcn_rna004@v0.1.1`, whose re-export
# tract can load; see `waveform_net` for the measurement and why the export
# version is the thing that decides this.
waveform-onnx = ["dep:tract-onnx"]
