[package]
name = "escapepod-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-level classification against escapepod-models bundles: the tRNA charging (aminoacylation) classifier over POD5 + aligned BAM."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "nanopore", "pod5", "sequencing"]
categories = ["science"]

[dependencies]
anyhow = { workspace = true }
# GBM runtime (tree walk + heads) — the model format `escpod` already runs.
escapepod-demux = { workspace = true }
# k-mer level primitives (extract_levels, load_kmer_table) and the POD5 surface.
escapepod-signal = { workspace = true }
# BAM reading for the pipeline (record types + the scan loop); writing the
# cl-tagged output BAM stays in the CLI.
noodles-bam = "0.95"
noodles-bgzf = "0.51"
noodles-sam = "0.90"
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
# One debug line: which loaded models needed their convolution padding hoisted
# (`fnn::hoist_conv_padding`), so a slow model can be diagnosed without a
# profiler.
tracing = { workspace = true }
# ONNX runtime for the per-base-feature network variant of a charging bundle
# (`feature_model`). Optional, but free in practice: `escapepod-cli` already
# links tract through escapepod-demux's `cnn-detect`, so turning this on adds
# no third-party crate to the binary — only this crate's own edge to it.
tract-onnx = { workspace = true, optional = true }
# onnxruntime for the windowed variant of a charging bundle (`waveform_model`).
# NOT interchangeable with tract: that graph comes out of PyTorch's dynamo
# exporter and tract 0.23 cannot close its shape inference (see
# `waveform_net`), so this is the runtime or there is no runtime.
# `load-dynamic` dlopens onnxruntime at run time — nothing at build time — and
# `default-features = false` drops `download-binaries`, which would otherwise
# drag ureq + native-tls + openssl-sys into a build that never downloads
# anything. The exact-version pin matches escapepod-demux's, so one lockfile
# entry serves both.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "api-27",
    "load-dynamic",
    "ndarray",
    "std",
    "tracing",
] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Verifies a real bundle against reference probabilities; needs the runtime it
# is verifying.
[[example]]
name = "verify_feature_model"
required-features = ["fnn-onnx"]

# The windowed variant's counterpart: checks the graph and the tensor assembly
# separately, against the corpus the model was trained on.
[[example]]
name = "verify_waveform_model"
required-features = ["waveform-onnx"]

[features]
default = []
# Load and score the `feature_model` (per-base-feature ONNX) variant of a
# charging bundle. Without it such a bundle is *refused at load* with a
# rebuild hint — never silently mis-scored, and never confused with the
# raw-signal CNN variant, which this crate does not implement at all.
fnn-onnx = ["dep:tract-onnx"]
# Load and score the windowed raw-signal (`waveform_model`) variant. Separate
# from `fnn-onnx` because it is not free the way that one is: it links `ort`
# and needs a `libonnxruntime.so` on `ORT_DYLIB_PATH` at run time. Without it
# such a bundle is refused at load with that rebuild hint, never mis-scored.
waveform-onnx = ["dep:ort"]
